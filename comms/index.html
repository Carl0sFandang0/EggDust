<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EggDust.co.uk.</title>
</head>



<body>
    <script>
        const ws = new WebSocket("ws://192.168.1.108:8181/phone");

        ws.onopen = () => {
            ws.send("Hello from phone!");
        };

        ws.onmessage = (event) => {
            //console.log("Laptop says:", event.data);
            document.getElementById("output").innerText = event.data;
        };
    </script>
    <main>

        <h1  id="output" class="text-xl p-4"></h1>

    </main>

</body>
</html>
