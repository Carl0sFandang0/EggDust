<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EggDust.co.uk.</title>
</head>



<body>
    <script>

            async function getLatestIssue() {
        try {
            const response = await fetch(
            "https://api.github.com/repos/Carl0sFandang0/EggDust/issues?sort=created&direction=desc&per_page=1"
            );

            const issues = await response.json();

            if (issues.length > 0) {
                document.getElementById("message").textContent =
                issues[0].title;
            }
        }
            catch (err) {
                console.error("GitHub read failed", err);
        }
}

            // Run immediately
            getLatestIssue();

            // Then every 10 seconds
            setInterval(getLatestIssue, 30000);
    </script>

    <main>
        <button style="font-size: 24px; padding: 15px 30px;" onclick="getLatestIssue()">Read Message Now (else update every 30 seconds)</button>

        <h1 style="border: 2px solid black;" id="message" class="text-xl p-4">waiting...</h1>

    </main>

</body>
</html>
