<!DOCTYPE html>

<html class="dark" lang="en"><head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EggDust.co.uk.</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#4f46e5",
                        "surface": "#13121b",
                        "background": "#13121b",
                        "outline-variant": "#464555",
                        "outline": "#918fa1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "section-gap": "0px"  /*was 120px*/
                    },
                    "fontFamily": {
                        "headline-md": ["Geist"],
                        "display-lg": ["Geist"],
                        "mono-code": ["Geist Mono"],
                        "body-md": ["Geist"],
                        "mono-label": ["Geist Mono"],
                        "body-lg": ["Geist"],
                        "display-lg-mobile": ["Geist"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "mono-code": ["14px", { "lineHeight": "1.7", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "mono-label": ["13px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #09090B;
            color: #e4e1ee;
            font-family: 'Geist', sans-serif;
            scroll-behavior: smooth;
        }

        .mono {
            font-family: 'Geist Mono', monospace;
        }

        .border-zinc-800 {
            border-color: #27272A;
        }

        .bg-zinc-900 {
            background-color: #18181B;
        }

        .bg-zinc-950 {
            background-color: #09090B;
        }

        .text-indigo-accent {
            color: #4F46E5;
        }

    </style>
</head>


<body class="selection:bg-primary-container selection:text-on-primary-container overflow-hidden">

<!-- TopNavBar -->
    <nav class="flex justify-between items-center w-full px-gutter py-4 sticky top-0 z-50 bg-surface/95 backdrop-blur-sm border-b border-outline-variant dark:border-outline-variant">
        <div class="text-[3rem] leading-none font-bold tracking-tighter text-indigo-accent ">
            EggDust
        </div>
        <div class="hidden md:flex gap-8">
        </div>

        <a class="bg-primary-container text-on-primary-container px-6 py-2 rounded-lg font-body-md hover:opacity-60 transition-opacity" href="../index.html">
            Home
        </a>
    </nav>

<!-- MAIN -->
    <main class="bg-zinc-900">
        
        <div class="grid grid-cols-1 [@media(min-aspect-ratio:1/1)]:grid-cols-4 h-[calc(100vh_-_80px)]">
            <div class="overflow-x-auto overflow-y-auto">
                <img src="text.svg" alt="">
            </div>
            <div class="col-span-3 overflow-hidden">

                <img class="object-contain" src="background.svg" alt="">

            </div>
        </div>

    </main>


</body>
</html>
