
<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EggDust.co.uk.</title>
</head>



<body>
    <script>
        async function updateMessage() {
            fetch('message.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('message').textContent = data.message;
  });

        }

        // Run immediately
        updateMessage();

        // Then every second
        setInterval(updateMessage, 1000);

    </script>
    <main>

        <h1 id="message" class="text-xl p-4">message area...</h1>

    </main>

</body>
</html>
