    <script>
            // Micro-interaction for the pipeline boxes
            document.querySelectorAll('.pipeline-arrow').forEach(item => {
                item.addEventListener('mouseenter', () => {
                    item.querySelector('.border-primary').classList.add('bg-primary/10');
                });
                item.addEventListener('mouseleave', () => {
                    item.querySelector('.border-primary').classList.remove('bg-primary/10');
                });
            });
